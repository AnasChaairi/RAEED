openapi: 3.0.3
info:
  title: RAEED API
  version: "1.0"
  description: >
    Core-flow contract for the RAEED MVP. Covers the endpoints with the most business logic
    (auth, children, sessions/attendance, memories, dashboard) in full; the remaining routes
    follow the same envelope/auth/error conventions documented in conventions.md and are
    listed there as a catalog rather than fully specified here — extend this file as each
    module is implemented, it is the contract both the Flutter app and the React dashboard
    generate typed clients from.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: localhost:3000

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    conversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    postId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque pagination cursor from a previous response's `page.cursor`.
    groupId:
      name: group_id
      in: query
      schema: { type: string, format: uuid }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: attendance.already_recorded }
            message: { type: string }
            details: { type: object, additionalProperties: true }

    Page:
      type: object
      properties:
        cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    Child:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        photo_url: { type: string, nullable: true }
        group:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        health_alert:
          type: boolean
          description: Presence-only flag; full health text is never inlined in a list response.
        next_session:
          type: object
          nullable: true
          description: The main group's next session that has not ended, generated from the weekly schedule first — what the guardian's Home card shows
          properties:
            id: { type: string, format: uuid }
            group_id: { type: string, format: uuid }
            starts_at: { type: string, format: date-time }
            title: { type: string, nullable: true }
        today_status:
          type: object
          description: Today's state for the Home card — the attendance mark once one exists, else the presence answer, else the open question, else that a session is scheduled
          properties:
            status:
              type: string
              enum: [no_session, scheduled, awaiting_presence_answer, presence_confirmed, presence_declined, presence_late, present, late, absent, excused]
            alert_raised_at: { type: string, format: date-time, description: When an unexplained absence was recorded }

    ChildDetail:
      allOf:
        - $ref: '#/components/schemas/Child'
        - type: object
          properties:
            dob: { type: string, format: date }
            school_level: { type: string, nullable: true }
            health_json: { type: object, additionalProperties: true }
            image_rights_level:
              type: string
              enum: [allowed, app_only, not_allowed]

    AttendanceRecordInput:
      type: object
      required: [child_id, status, recorded_at_client]
      properties:
        child_id: { type: string, format: uuid }
        status: { type: string, enum: [present, absent, late, excused] }
        recorded_at_client: { type: string, format: date-time }

    AttendanceRecord:
      type: object
      description: >
        One row of the attendance sheet — a row per *enrolled child*, not per
        existing record, since children with no mark yet are the point of
        opening the sheet. `status`/`recorded_by`/`recorded_at` are therefore
        null until someone marks them.


        The nested `child` and `presence_answer` settle a gap between this file
        and 06-mobile-app-spec.md: the marking screen needs each child's name,
        a health-alert flag and the guardian's pre-fill, none of which the
        original flat shape carried. `child.health_alert` is a boolean and the
        health text is never included — an attendance list is read in a room
        with parents at the door.
      properties:
        child_id: { type: string, format: uuid }
        child:
          type: object
          properties:
            id: { type: string, format: uuid }
            full_name: { type: string }
            photo_url: { type: string, nullable: true }
            health_alert:
              type: boolean
              description: Presence-only flag; never the health text itself.
        presence_answer:
          type: object
          nullable: true
          description: The guardian's answer, when they gave one (ATT-02/ATT-04).
          properties:
            answer: { type: string, enum: [yes, no, late] }
            reason:
              type: string
              nullable: true
              enum: [illness, travel, exam, other]
        status:
          type: string
          nullable: true
          enum: [present, absent, late, excused]
        recorded_by: { type: string, format: uuid, nullable: true }
        recorded_at: { type: string, format: date-time, nullable: true }

    PresenceAnswerInput:
      type: object
      required: [child_id, answer]
      properties:
        child_id: { type: string, format: uuid }
        answer: { type: string, enum: [yes, no, late] }
        reason: { type: string, enum: [illness, travel, exam, other], nullable: true }

    MemoriesPostInput:
      type: object
      required: [album_id, media, tagged_child_ids]
      properties:
        album_id: { type: string, format: uuid }
        caption: { type: string }
        media:
          type: array
          items:
            type: object
            required: [storage_key, media_kind]
            properties:
              storage_key: { type: string }
              media_kind: { type: string, enum: [photo, video] }
        tagged_child_ids:
          type: array
          items: { type: string, format: uuid }

    Announcement:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, nullable: true }
        priority: { type: string, enum: [normal, urgent] }
        pinned: { type: boolean }
        publish_at: { type: string, format: date-time }

    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        enrolled_count: { type: integer }
        capacity: { type: integer, nullable: true }
        weekly_schedule:
          type: array
          description: The slots behind schedule_label, for the editor
          items:
            type: object
            properties:
              weekday: { type: integer, description: 0 = Sunday }
              starts_at: { type: string }
              ends_at: { type: string }
        educators:
          type: array
          description: Ids only — app_user carries no display name yet
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
        schedule_label: { type: string, nullable: true, description: Rendered server-side from weekly_schedule_json in the caller's locale }
        place: { type: string, nullable: true }

    GroupSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        title: { type: string, nullable: true }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [planned, delivered, cancelled] }
        attendance:
          type: object
          properties:
            recorded: { type: boolean }
            present_count: { type: integer, nullable: true }
            enrolled_count: { type: integer, nullable: true }

    ConversationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [child, staff, executive] }
        title: { type: string }
        is_member: { type: boolean, description: False means the caller reads by oversight, which is logged }
        last_message:
          type: object
          nullable: true
          properties:
            preview: { type: string, nullable: true }
            sent_at: { type: string, format: date-time }
        unread_count: { type: integer }
        has_open_report: { type: boolean }

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        sender:
          type: object
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            role: { type: string, nullable: true, enum: [parent, educator, executive, admin] }
        kind: { type: string, enum: [text, voice, file] }
        body: { type: string, nullable: true, description: Null for members once hidden; oversight keeps the text }
        duration_seconds: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        hidden:
          type: object
          nullable: true
          properties:
            by_id: { type: string, format: uuid }
            by_name: { type: string }
            at: { type: string, format: date-time }
        report:
          type: object
          nullable: true
          description: Only sent to oversight callers while the report is open
          properties:
            id: { type: string, format: uuid }
            reporter_id: { type: string, format: uuid }
            reporter_name: { type: string }
            reason: { type: string }

    ReviewPost:
      type: object
      properties:
        id: { type: string, format: uuid }
        album:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            group_name: { type: string, nullable: true }
            moderation_mode: { type: string, enum: [publish_then_moderate, approve_before_publish] }
        author_id: { type: string, format: uuid }
        author_name: { type: string }
        created_at: { type: string, format: date-time }
        media_count: { type: integer }
        media_kind: { type: string, enum: [photo, video, banner] }
        thumbnail_url: { type: string, nullable: true }
        tags:
          type: array
          items:
            type: object
            properties:
              child_id: { type: string, format: uuid }
              full_name: { type: string }
              image_rights_level: { type: string, enum: [allowed, app_only, not_allowed], description: The child's current level, resolved at read time }
        moderation_status: { type: string, enum: [pending, published, hidden] }
        is_blocked: { type: boolean, description: Hidden by a consent downgrade after publication }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [critical, request, memories, security, other] }
        title: { type: string }
        body: { type: string, nullable: true }
        destination: { type: string, nullable: true, enum: [groups, memories, messages, announcements, notifications] }
        sent_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }

    Family:
      type: object
      properties:
        id: { type: string, description: The sorted guardian ids, joined — stable across requests }
        label: { type: string }
        guardians:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              display_name: { type: string }
              relationship: { type: string, example: mother }
              phone_hint: { type: string, nullable: true, description: The last two digits only, masked — the full number is a recorded reveal }
              account: { type: string, enum: [active, pending] }
        children:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              full_name: { type: string }
              dob: { type: string, format: date, nullable: true }
              group:
                type: object
                nullable: true
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
        status: { type: string, enum: [active, partial, pending] }

    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor:
          type: object
          properties:
            id: { type: string, format: uuid, nullable: true }
            display_name: { type: string }
            role: { type: string, nullable: true }
        action: { type: string, example: child.health_view }
        resource_type: { type: string }
        resource_id: { type: string, format: uuid, nullable: true }
        resource_label: { type: string, nullable: true }
        device_meta: { type: object, nullable: true, additionalProperties: true }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated, but outside the caller's permission scope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: State changed since the client last read it
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /auth/login:
    post:
      summary: Sign in with a phone number and password
      description: >
        Every failure is `auth.invalid_credentials` — an unknown number, an
        account with no password yet, a deactivated account and a wrong
        password are indistinguishable from outside (ACC-02). Five failed
        attempts lock the number for fifteen minutes (`auth.rate_limited`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, device_id]
              properties:
                phone: { type: string, example: "+2126XXXXXXXX" }
                password:
                  type: string
                  pattern: '^[A-Za-z0-9]{6}$'
                  description: Exactly six letters or digits.
                device_id:
                  type: string
                  format: uuid
                  description: >
                    Per-install identifier the refresh token is scoped to
                    (ACC-07), so DELETE /auth/sessions/{deviceId} can revoke
                    exactly one device. Randomly generated by the client on
                    first launch — deliberately not a hardware id, which would
                    be device fingerprinting.
      responses:
        '200':
          description: Issued tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        '401': { description: Phone number and password do not match an active account }
        '429': { description: Too many failed attempts — `retry_after_seconds` in details }

  /auth/me/password:
    patch:
      summary: Change the caller's own password
      description: >
        The current password is required even though the caller holds a valid
        token — a phone left unlocked must not be enough to lock its owner out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, pattern: '^[A-Za-z0-9]{6}$' }
                new_password: { type: string, pattern: '^[A-Za-z0-9]{6}$' }
      responses:
        '204': { description: Changed }
        '401': { description: The current password is wrong (`auth.invalid_credentials`) }

  /auth/refresh:
    post:
      summary: Rotate a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, device_id]
              properties:
                refresh_token: { type: string }
                device_id:
                  type: string
                  format: uuid
                  description: >
                    The device whose session is being rotated. A rotation for a
                    revoked device must fail rather than silently issue a fresh
                    pair.
      responses:
        '200': { description: New token pair issued }
        '401': { description: Refresh token revoked or expired }

  /auth/sessions/{deviceId}:
    delete:
      summary: Revoke one device's session (self-service, or Admin forcing a deactivated staff member off, ACC-07)
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/me:
    get:
      summary: The signed-in user, with the scope their abilities are built from
      description: >
        Called on cold start to turn a stored access token back into a session,
        and immediately after `/auth/login`. Returns the reachable child
        and group ids resolved server-side from live `parent_child` /
        `group_educator` rows — scope is derived, never stored redundantly and
        never computed on the client (05-authorization.md).


        Deliberately omits `phone`: MSG-06 forbids rendering `app_user.phone`
        to a non-executive role in any payload, and the mobile session has no
        use for it after login.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, roles, display_name]
                properties:
                  id: { type: string, format: uuid }
                  display_name: { type: string }
                  preferred_locale: { type: string, enum: [ar, fr, en] }
                  roles:
                    type: array
                    items: { type: string, enum: [parent, educator, executive, admin] }
                  branch_id:
                    type: string
                    format: uuid
                    nullable: true
                    description: Set when an executive/admin is restricted to one branch (ACC-08).
                  reachable_child_ids:
                    type: array
                    items: { type: string, format: uuid }
                  reachable_group_ids:
                    type: array
                    items: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /consent:
    get:
      summary: What consent is still outstanding for the caller (ACC-06)
      description: >
        Drives the blocking `/consent` screen. The server resolves this, never
        the client: `consent_record` is append-only, two guardians of the same
        child can hold different levels, and most-restrictive-wins is applied in
        the `children` service (03-domain-model/entities.md). A client that
        cached "already consented" would walk past a later downgrade.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [privacy_policy_accepted, children]
                properties:
                  privacy_policy_accepted: { type: boolean }
                  children:
                    type: array
                    items:
                      type: object
                      required: [id, full_name]
                      properties:
                        id: { type: string, format: uuid }
                        full_name: { type: string }
                        current_level:
                          type: string
                          nullable: true
                          enum: [allowed, app_only, not_allowed]
                          description: >
                            Null when this guardian has recorded no
                            `consent_record` row for this child yet — the case
                            the consent screen exists to resolve.
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Record the privacy-policy and per-child image-rights consents (ACC-06)
      description: >
        Appends `consent_record` rows; never updates in place, so the full
        history survives for AUD-02 and for WAL-06's re-check-on-downgrade job.


        `image_rights` carries an entry for **every** child the screen
        displayed, including those left at the default — "the guardian looked at
        this and left it at not-allowed" and "the guardian was never asked" must
        be distinguishable rows. The client defaults an untouched child to
        `not_allowed`; the server must not widen a missing entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privacy_policy_accepted, image_rights]
              properties:
                privacy_policy_accepted: { type: boolean }
                image_rights:
                  type: array
                  description: >
                    One entry per child the screen displayed. A list rather than
                    a map keyed by child id: each entry is a typed object the
                    contract can describe and the server can validate per field,
                    and the order the screen showed is preserved.
                  items:
                    type: object
                    required: [child_id, level]
                    properties:
                      child_id: { type: string, format: uuid }
                      level:
                        type: string
                        enum: [allowed, app_only, not_allowed]
      responses:
        '204': { description: Recorded }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: A child id the caller does not guard }

  /children:
    get:
      description: >
        `q` searches the name, `category_id` and `group_id` narrow, and
        `unassigned=true` lists children with no current main group. For
        oversight callers each row also carries `image_rights_level` and this
        season's `attendance { present, expected }`; guardians' rows never do.
      summary: List children the caller may see (own children / own groups / all, scoped per 05-authorization.md)
      parameters:
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - { name: unassigned, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/groupId'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Child' } }
                  page: { $ref: '#/components/schemas/Page' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /children/{childId}:
    get:
      summary: Get a child's full profile (health info access is separately audit-logged, AUD-03)
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }

  /children/{childId}/change-requests:
    post:
      summary: Request a change to a child's profile (tiered — see CHD-04 recommendation in 01-product-brief.md)
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_path, proposed_value]
              properties:
                field_path: { type: string, example: health_json.allergies }
                proposed_value: {}
      responses:
        '201': { description: Request created — auto-approved instantly for self-edit-instant fields, pending for the rest }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups/{groupId}/sessions:
    get:
      description: Most recent first, with each session's attendance state (recorded / present count / enrolled).
      summary: List a group's sessions
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: OK }

  /sessions/{sessionId}/presence-confirmation:
    post:
      summary: Send the presence confirmation for a session (ATT-01)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Confirmation sent, deadline scheduled }
        '403': { $ref: '#/components/responses/Forbidden' }

  /presence-confirmations/pending:
    get:
      summary: Confirmations the caller has not answered yet
      description: >
        Backs the unanswered-confirmation surface on the Home card. A
        confirmation that arrived only as a push is lost the moment the push is,
        and `ATT-04` lets a guardian declare an absence in advance without
        waiting for one at all — so this list is a real surface, not a cache of
        notifications.


        Scoped to the caller's own children via `parent_child`, resolved
        server-side.


        **One row per child, not per confirmation.** A confirmation belongs to a
        session and so covers a whole group; a guardian with two children in
        that group owes two answers against the same `id`, and collapsing them
        loses one child's prompt.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [confirmation_id, session_id, child_id, child_name, session_starts_at]
                      properties:
                        confirmation_id: { type: string, format: uuid }
                        session_id: { type: string, format: uuid }
                        child_id: { type: string, format: uuid }
                        child_name: { type: string }
                        session_starts_at: { type: string, format: date-time }
                        group_name: { type: string, nullable: true }
                        deadline_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: After this, the confirmation stops accepting answers.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /presence-confirmations/{confirmationId}/answers:
    post:
      summary: Submit a guardian's presence answer for one child (ATT-02/ATT-04)
      parameters:
        - name: confirmationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresenceAnswerInput' }
      responses:
        '200': { description: Recorded }

  /sessions/{sessionId}/attendance:
    get:
      summary: Get the attendance sheet, pre-filled from presence answers (ATT-06)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AttendanceRecord' } }
                  session:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      group_id: { type: string, format: uuid }
                      group_name: { type: string }
                      starts_at: { type: string, format: date-time }
                      ends_at: { type: string, format: date-time, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Submit/update the attendance sheet for a session
      description: >
        Any `absent` status with no matching prior `no`/absence-declared PresenceAnswer
        synchronously enqueues the critical absence-alert job before this call returns
        (see 02-architecture.md and 09-notifications-spec.md). A record whose
        `recorded_at_client` is older than the server's current `recorded_at` for that
        child is rejected with `attendance.conflict`, not overwritten.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  items: { $ref: '#/components/schemas/AttendanceRecordInput' }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied:
                    type: array
                    items: { type: string, format: uuid }
                  alerts_enqueued:
                    type: array
                    items: { type: string, format: uuid }
                    description: >
                      Children whose mark triggered a critical absence alert —
                      `absent` with no prior `no`/`late` answer. Enqueued before
                      this response is written.
        '409':
          description: >
            `attendance.conflict`. `details` carries `child_id` and a `current`
            object with the record that won, so the device can show the educator
            what their mark lost to rather than silently discarding it.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { description: '`attendance.unknown_child` — not enrolled in this session''s group' }

  /memories/posts:
    post:
      summary: Publish a Memories Wall post
      description: >
        Rejected with `memories.consent_blocked` (+ the offending child_id) if any tagged
        child's current image_rights_level is `not_allowed` (WAL-06). Status is `pending`
        if the album's moderation_mode is `approve_before_publish`, else `published`
        immediately, visible only to guardians of tagged/group children.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoriesPostInput' }
      responses:
        '201': { description: Created (published or pending) }
        '422':
          description: memories.consent_blocked
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /announcements:
    get:
      summary: List announcements visible to the caller
      parameters:
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Announcement' } }
                  page: { $ref: '#/components/schemas/Page' }
    post:
      summary: Publish an announcement (Executives — any audience; Educators — own groups only, ANN-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, audience]
              properties:
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 5000 }
                audience:
                  type: object
                  description: audience_json — `{ type, category_ids?, group_ids? }`; educators may only use `groups` with their own groups (ANN-03)
                  required: [type]
                  properties:
                    type: { type: string, enum: [all, parents, educators, categories, groups] }
                    category_ids: { type: array, items: { type: string, format: uuid } }
                    group_ids: { type: array, items: { type: string, format: uuid } }
                priority: { type: string, enum: [normal, urgent], default: normal, description: urgent is placed on the critical lane before the response is written }
                expire_at: { type: string, format: date-time }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dashboard/overview:
    get:
      summary: Executive dashboard overview (DSH-01, EXEC-M-01) — reuses the same permission-scoped services as the mobile API
      description: >
        Executives and admins only, narrowed to the caller's branch when their
        role assignment carries one. Alerts are ordered by the executive's
        questions: sessions that ended with no mark and today's unexplained
        absences (danger), groups over capacity (warning), posts and reports
        awaiting a decision (info). Day and week boundaries are taken in the
        association's timezone.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        severity: { type: string, enum: [danger, warning, info] }
                        text: { type: string, description: Already localised to the caller's preferred_locale }
                        destination: { type: string, enum: [groups, memories, messages, announcements, notifications] }
                        raised_at: { type: string, format: date-time }
                        group_id: { type: string, format: uuid, nullable: true }
                        session_id: { type: string, format: uuid, nullable: true }
                  stats:
                    type: object
                    description: children / families / groups / educators, each `{ value, delta }`; delta is null until a previous period exists to compare against
                    additionalProperties:
                      type: object
                      properties:
                        value: { type: integer }
                        delta: { type: integer, nullable: true }
                  weekly_attendance:
                    type: object
                    nullable: true
                    properties:
                      present_count: { type: integer }
                      expected_count: { type: integer }
                      weekly_rates: { type: array, items: { type: integer }, description: Percent per trailing week, oldest first, weeks with nothing expected omitted }
                      delta_points: { type: integer, nullable: true }
                  today_sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        group_id: { type: string, format: uuid }
                        group_name: { type: string }
                        title: { type: string, nullable: true }
                        educator_name: { type: string, nullable: true }
                        starts_at: { type: string, format: date-time }
                        ends_at: { type: string, format: date-time }
                        attendance_recorded: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups:
    post:
      summary: Create a group in the active season with its educators and any unassigned children (recorded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category_id, educator_ids]
              properties:
                name: { type: string }
                category_id: { type: string, format: uuid }
                capacity: { type: integer }
                weekly_schedule:
                  type: array
                  items:
                    type: object
                    properties:
                      weekday: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday }
                      starts_at: { type: string, example: "16:00" }
                      ends_at: { type: string, example: "18:00" }
                educator_ids: { type: array, items: { type: string, format: uuid } }
                child_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } }
    get:
      summary: Groups the caller may see (EXEC-M-05) — an executive's branch scope, an educator's own groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Group' } }
                  page: { $ref: '#/components/schemas/Page' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups/{groupId}/children:
    post:
      summary: Assign children to a group as their main group — a new child_group row, the previous one closed (ORG-04); recorded
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [child_ids]
              properties:
                child_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrolled_count: { type: integer }
                  capacity: { type: integer, nullable: true }

  /groups/{groupId}:
    get:
      summary: One group
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Replace the group's weekly schedule (Executive/Admin) — recorded as `group.update`; the coming weeks' sessions are generated at once
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekly_schedule]
              properties:
                weekly_schedule:
                  type: array
                  maxItems: 7
                  items:
                    type: object
                    required: [weekday, starts_at, ends_at]
                    properties:
                      weekday: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday }
                      starts_at: { type: string, example: "16:00" }
                      ends_at: { type: string, example: "18:00" }
      responses:
        '200':
          description: The group as it now is
          content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: "`validation.failed` — a slot ends before it starts" }

  /announcements/reach:
    get:
      summary: How many people each audience reaches right now, in the caller's scope (EXEC-M-02)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  all: { type: integer }
                  parents: { type: integer }
                  educators: { type: integer }
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        guardian_count: { type: integer }

  /conversations:
    get:
      summary: Conversations the caller may see — as a member, or by oversight (MSG-08)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ConversationSummary' } }
                  page: { $ref: '#/components/schemas/Page' }

  /conversations/{conversationId}:
    get:
      summary: A conversation's header — title, membership and member labels (never a phone number, MSG-06)
      parameters:
        - $ref: '#/components/parameters/conversationId'
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conversations/{conversationId}/messages:
    get:
      summary: The thread, oldest first. A non-member's read is oversight and is audit-logged before the rows are returned.
      parameters:
        - $ref: '#/components/parameters/conversationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  page: { $ref: '#/components/schemas/Page' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Send a text message
      parameters:
        - $ref: '#/components/parameters/conversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, body]
              properties:
                kind: { type: string, enum: [text] }
                body: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }

  /messages/{messageId}/hide:
    post:
      summary: Hide a message (oversight only). Reversible, audit-logged, closes any open report; never a deletion.
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Hidden }
        '403': { $ref: '#/components/responses/Forbidden' }

  /message-reports/{reportId}/dismiss:
    post:
      summary: Close a report without hiding the message (oversight only, audit-logged)
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Dismissed }
        '403': { $ref: '#/components/responses/Forbidden' }

  /memories/review-queue:
    get:
      summary: Posts awaiting moderation (EXEC-M-04) — pending, plus published posts auto-hidden by a consent downgrade
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  moderation_mode:
                    type: string
                    nullable: true
                    enum: [publish_then_moderate, approve_before_publish]
                    description: The one mode every album in scope runs under; null when unset or mixed (open decision #3)
                  data: { type: array, items: { $ref: '#/components/schemas/ReviewPost' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /memories/albums:
    get:
      summary: The active season's albums with their published post counts
      responses:
        '200': { description: OK }

  /memories/posts/{postId}/approve:
    post:
      summary: Publish a pending post, or re-publish a blocked one. Re-checks every tagged child's current image rights (WAL-06).
      parameters:
        - $ref: '#/components/parameters/postId'
      responses:
        '204': { description: Published }
        '422':
          description: memories.consent_blocked — `details.child_ids` names the children whose guardians said no
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /memories/posts/{postId}/hide:
    post:
      summary: Hide a post. Never a deletion.
      parameters:
        - $ref: '#/components/parameters/postId'
      responses:
        '204': { description: Hidden }

  /notifications:
    get:
      summary: The caller's own notification centre, newest first (09-notifications-spec)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  page: { $ref: '#/components/schemas/Page' }

  /notifications/read-all:
    post:
      summary: Mark every notification of the caller read
      responses:
        '204': { description: Done }

  /children/{childId}/health:
    get:
      summary: A deliberate, recorded read of a child's health information (AUD-03, EXEC-M-09)
      description: >
        Oversight only. The audit entry (`child.health_view`) is written
        before the text is read, and `GET /children/{id}` withholds
        `health_json` from oversight callers so that fetching the profile can
        never log or leak it by accident. Guardians and educators keep the
        text on the profile, by relationship.
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  child_id: { type: string, format: uuid }
                  health_json: { type: object, additionalProperties: true }
                  health_json_version: { type: integer }
                  special_needs_notes: { type: string, nullable: true }
                  viewed_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }

  /children/{childId}/guardians/{guardianId}/phone:
    get:
      summary: A recorded reveal of a guardian's phone number (MSG-06) — oversight only
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: guardianId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK — logged as `guardian.phone_reveal`
          content:
            application/json:
              schema:
                type: object
                properties:
                  guardian_id: { type: string, format: uuid }
                  phone: { type: string, nullable: true }
                  revealed_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }

  /families:
    get:
      summary: Households (EXEC-M-10), derived — children sharing the same current guardians
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Family' } }
                  page: { $ref: '#/components/schemas/Page' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a household — guardians, their children and links, in one recorded act (ACC-02)
      description: >
        A guardian whose phone already has an account is linked, not
        duplicated. Each new account is handed a generated first password,
        returned once in the response for the executive to pass on in person;
        it is never stored in clear. Children carry no health information
        here: the guardian enters it from their own account (CHD-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guardians, children]
              properties:
                guardians:
                  type: array
                  items:
                    type: object
                    required: [display_name, phone, relationship]
                    properties:
                      display_name: { type: string }
                      phone: { type: string, example: "+2126XXXXXXXX" }
                      relationship: { type: string, example: mother }
                children:
                  type: array
                  items:
                    type: object
                    required: [full_name, dob]
                    properties:
                      full_name: { type: string }
                      dob: { type: string, format: date }
                      group_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  guardian_ids: { type: array, items: { type: string, format: uuid } }
                  child_ids: { type: array, items: { type: string, format: uuid } }
                  invitations: { type: integer, description: How many accounts were created }
                  guardians:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        display_name: { type: string }
                        password:
                          type: string
                          nullable: true
                          description: The first password of a new account; null when the phone already had one.

  /invitations:
    post:
      summary: Hand a guardian a fresh password (recorded, replaces the old one at once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '200':
          description: The new password, returned once
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  password: { type: string }

  /families/{familyId}:
    parameters:
      - name: familyId
        in: path
        required: true
        description: The family's id as `GET /families` returns it — the sorted guardian ids, joined by commas. It changes when a guardian is linked or unlinked; every mutation below returns the family it now is.
        schema: { type: string }
    get:
      summary: One household (EXEC-M-10b)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /families/{familyId}/guardians:
    parameters:
      - name: familyId
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Link a guardian to every child of the household (ACC-05) — Executive/Admin only
      description: >
        A phone that already has an account is linked, not duplicated, and
        gets no new password. A new account is handed a generated first
        password, returned once. Recorded as `guardian.link`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, phone, relationship]
              properties:
                display_name: { type: string }
                phone: { type: string, example: "+2126XXXXXXXX" }
                relationship: { type: string, example: father }
      responses:
        '201':
          description: Linked — the family as it now is, and the credential to hand over
          content:
            application/json:
              schema:
                type: object
                properties:
                  family: { $ref: '#/components/schemas/Family' }
                  credential:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      display_name: { type: string }
                      password: { type: string, nullable: true, description: Null when the phone already had an account }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`guardians.already_linked` — this account is already a guardian of every child here"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /families/{familyId}/guardians/{guardianId}:
    parameters:
      - name: familyId
        in: path
        required: true
        schema: { type: string }
      - name: guardianId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Edit a guardian — name, phone, relationship to the household's children
      description: >
        Every field is optional; only what is sent changes. Changing the phone
        changes the sign-in identifier: the password is kept, every device is
        signed out at once, and the guardian signs in again on the new number.
        The relationship applies to each of this household's children.
        Recorded as `guardian.update` with the names of the changed fields —
        never the number itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                phone: { type: string, example: "+2126XXXXXXXX" }
                relationship: { type: string, example: mother }
      responses:
        '200':
          description: The family as it now is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`guardians.phone_taken` — another account already signs in with that number"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      summary: Unlink a guardian from every child of the household (ACC-05) — Executive/Admin only
      description: >
        The link rows are closed (`unlinked_at`), never deleted; the account
        itself stays. Refused when any child would be left without a guardian.
        Recorded as `guardian.unlink`.
      responses:
        '200':
          description: The family as it now is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`children.last_guardian` — `details.child_ids` names the children who have no other guardian"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /families/{familyId}/children:
    parameters:
      - name: familyId
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Add a child to the household — linked to every current guardian
      description: >
        Same shape as a child in `POST /families`: no health information here,
        the guardian enters it (CHD-04). Recorded as `child.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, dob]
              properties:
                full_name: { type: string }
                dob: { type: string, format: date }
                group_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  family: { $ref: '#/components/schemas/Family' }
                  child_id: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }

  /families/{familyId}/children/{childId}:
    parameters:
      - name: familyId
        in: path
        required: true
        schema: { type: string }
      - name: childId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Correct a child's name or date of birth
      description: Recorded as `child.update` (every write to `child` is logged).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                dob: { type: string, format: date }
      responses:
        '200':
          description: The family as it now is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /educators:
    get:
      summary: Educators with their group count, for the new-group form
      responses:
        '200': { description: OK }

  /reports/attendance:
    get:
      summary: Attendance this season by educator and by category, as raw present/expected pairs (EXEC-M-11)
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/educators:
    get:
      summary: Per educator — sessions planned, delivered, and marked within 30 minutes of the end
      responses:
        '200': { description: OK }

  /reports/engagement:
    get:
      summary: Guardians who have signed in, presence answers given; homework is null until it exists
      responses:
        '200': { description: OK }

  /reports/exports:
    post:
      summary: A children list as CSV with exactly the fields named (recorded as `report.export` with the field list)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  items: { type: string, enum: [name, dob, group, guardian, phone, consent, allergies, medications] }
                group_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created — `content` is UTF-8 CSV with a BOM
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename: { type: string }
                  content_type: { type: string, enum: [text/csv] }
                  content: { type: string }
                  fields: { type: array, items: { type: string } }
                  contains_health: { type: boolean }
                  row_count: { type: integer }
                  created_at: { type: string, format: date-time }

  /seasons:
    get:
      summary: Seasons with group and child counts (Admin only, EXEC-M-12)
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Open a season (Admin only) — active from creation; the previous one is archived from the list, never closed by this call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, start_date, end_date]
              properties:
                label: { type: string, example: "2026-2027" }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
      responses:
        '201': { description: Created — recorded as `season.create` }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: "`validation.failed` — end_date must be after start_date" }

  /seasons/{seasonId}/archive:
    post:
      summary: Archive a season — read-only afterwards, never deleted (Admin only)
      parameters:
        - name: seasonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Archived }

  /categories:
    get:
      summary: The categories (فئات) with counts; age range and gender are null until decided (open decision #1)
      responses:
        '200': { description: OK }
    post:
      summary: Add a category (Admin only) — by name; age range and gender are not taken until open decision #1 is settled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: الأشبال }
      responses:
        '201': { description: Created — recorded as `category.create` }
        '403': { $ref: '#/components/responses/Forbidden' }

  /branches:
    get:
      summary: Branches with their executives (Admin only)
      responses:
        '200': { description: OK }
    post:
      summary: Create a branch (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                address: { type: string }
      responses:
        '201': { description: Created }

  # --- Educator surface (EDU-M-01..10) ---------------------------------------

  /educator/today:
    get:
      summary: The educator's Today (EDU-M-01)
      description: >
        The next session with the guardians' presence tallies and attendance state,
        today's sessions, the schedule-generated sessions still without content
        in the next 7 days, and the pinned announcement with whether the caller
        confirmed reading it. Generates missing sessions from the weekly schedule
        for the week ahead first (SES-02).
      responses:
        '200': { description: OK }

  /sessions:
    get:
      summary: Sessions of the caller's groups in a window, generated from the weekly schedule first (SES-02)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: group_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK — each row carries has_content, material_count, homework_count, attendance_recorded, summary_sent, rescheduled_from }

  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: One session with objectives, materials, homework, attendance and presence counts
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Add or edit content (title, theme, objectives, material visibility); marks the session customised
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                theme: { type: string }
                objectives: { type: string }
                materials:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      visibility: { type: string, enum: [before_session, after_session, staff_only] }
      responses:
        '200': { description: The updated session }

  /sessions/{sessionId}/materials:
    post:
      summary: Attach an uploaded file or a link to a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind, storage_key]
              properties:
                kind: { type: string, enum: [document, image, audio, video, link] }
                storage_key: { type: string, description: A key from POST /media, or the URL for a link }
                title: { type: string }
                visibility: { type: string, enum: [before_session, after_session, staff_only] }
                size_bytes: { type: integer }
      responses:
        '201': { description: Created }

  /materials/{materialId}:
    delete:
      summary: Remove a material (soft)
      parameters:
        - name: materialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed }

  /sessions/{sessionId}/cancel:
    post:
      summary: Cancel or reschedule a session and tell guardians, co-educators and executives
      description: >
        Less than 24h out the notice is critical and goes on the critical queue
        (09-notifications-spec.md); otherwise normal. Recorded as session.cancel /
        session.reschedule in the caller's name.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [mode, reason]
              properties:
                mode: { type: string, enum: [cancel, reschedule] }
                reason: { type: string }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                place: { type: string }
      responses:
        '200': { description: "{ notified_count, guardian_count }" }

  /sessions/{sessionId}/summary:
    post:
      summary: Send "what we did today" to the group's guardians, once
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                media_keys: { type: array, items: { type: string } }
      responses:
        '200': { description: "{ sent_at, family_count }" }
        '409': { description: session.summary_already_sent }

  /sessions/{sessionId}/presence:
    get:
      summary: Who confirmed, declined (with reason) or never answered (EDU-M-02)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }

  /sessions/{sessionId}/presence/remind:
    post:
      summary: One reminder to the guardians who have not answered
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: "{ reminded_count, sent_at }" }
        '409': { description: presence.reminder_already_sent }

  /sessions/{sessionId}/homework:
    post:
      summary: Set homework for the whole group or named children (HWK-01)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [instructions, due_at]
              properties:
                title: { type: string }
                instructions: { type: string }
                due_at: { type: string, format: date-time }
                target_child_ids: { type: array, items: { type: string, format: uuid }, description: Omitted = whole group }
                attachment_storage_key: { type: string }
      responses:
        '201': { description: Created — done counts are self-reported (HWK-03) }

  /groups/{groupId}/homework:
    get:
      summary: A group's homework with self-reported done counts
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }

  /groups/{groupId}/roster:
    get:
      summary: The group's children as the educator's roster shows them (health flag, image rights, attendance, care flag)
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }

  /media:
    post:
      summary: Upload a file (image, audio, video ≤ 50 MB, or document) to the local StorageProvider
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: "{ storage_key, url, kind, name, size_bytes, content_type }" }

  /media/{key}:
    get:
      summary: Serve an uploaded file to a signed-in user
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: The file }

  /memories/posts:
    get:
      summary: The caller's own posts (`?mine=true`) with where each stands
      parameters:
        - name: mine
          in: query
          required: true
          schema: { type: boolean }
      responses:
        '200': { description: OK }

  /announcements/{announcementId}/confirm-read:
    post:
      summary: "I have read this" (ANN-06); idempotent
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: "{ confirmed_at }" }

  /children/{childId}/emergency-call:
    post:
      summary: A recorded emergency call to the child's emergency contact; the number goes to the dialer, never on screen
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: "{ guardian_id, display_name, phone, recorded_at }" }

  /auth/me/availability:
    patch:
      summary: The educator's availability window (MSG-07), applied to every group they lead
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [start, end]
              properties:
                start: { type: string, example: "09:00" }
                end: { type: string, example: "20:00" }
      responses:
        '200': { description: "{ start, end }" }

  /audit-log:
    get:
      summary: Read the audit log (Admin only, EXEC-M-13). `?action=child.health_view` is the health-access view.
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  page: { $ref: '#/components/schemas/Page' }
        '403': { $ref: '#/components/responses/Forbidden' }
