# CI for the Flutter app.
#
# `specs/12-devops-and-environments.md` requires every PR to run lint +
# typecheck + tests. This adds two RAEED-specific gates that ordinary Flutter CI
# would not have, both guarding rules the specs call non-negotiable:
#
#   * the design tokens cannot drift from `specs/08-design-system/`
#   * no hardcoded colour or font name can reach app code
name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'specs/08-design-system/**'
      - 'specs/04-api/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'specs/08-design-system/**'
      - 'specs/04-api/**'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test tool

      - name: Verify generated code is current
        # Generated files are committed so a plain `flutter test` needs no
        # codegen step. That only holds if they are regenerated when their
        # sources change — a stale *.g.dart that still compiles is the failure
        # mode this catches.
        run: |
          dart run build_runner build
          flutter gen-l10n
          if ! git diff --exit-code --stat -- lib; then
            echo "::error::Generated code is stale. Run:"
            echo "  dart run build_runner build && flutter gen-l10n"
            exit 1
          fi

      - name: Verify the design tokens match the spec
        # specs/README.md: the tokens file is the only source of colour and type
        # values. This fails if design_tokens.gen.dart was edited by hand or the
        # tokens file changed without regenerating.
        run: dart run tool/generate_design_tokens.dart --check

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: warn

  safeguarding-rules:
    name: Safeguarding and design-system rules
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: No hardcoded colours in app code
        # `specs/README.md`: "The design tokens in design-tokens.json are the
        # only source of color and type values. No hex codes or font names
        # hardcoded in app or dashboard code."
        run: |
          matches=$(grep -rnE "Color\(0x|Colors\.[a-z]" lib \
            --include='*.dart' \
            | grep -v '\.gen\.dart' \
            | grep -v '\.g\.dart' \
            | grep -v 'Colors\.transparent' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Hardcoded colours found. Use context.palette instead:"
            echo "$matches"
            exit 1
          fi

      - name: No hardcoded font families in app code
        run: |
          matches=$(grep -rnE "fontFamily:\s*'" lib \
            --include='*.dart' \
            | grep -v '\.gen\.dart' \
            | grep -v 'raeed_typography.dart' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Hardcoded font family found. Use context.type instead:"
            echo "$matches"
            exit 1
          fi

      - name: No role branching in widgets
        # `specs/05-authorization.md`: permission checks go through the ability
        # model, never `if (role == 'educator')` scattered through the UI.
        # Scope in RAEED is always "what role, against which relationship" — a
        # bare role check gets that wrong the moment an educator opens a child
        # outside their own group.
        run: |
          matches=$(grep -rnE "role\s*==\s*RaeedRole\.|RaeedRole\.[a-z]+\s*==" lib \
            --include='*.dart' \
            | grep -v 'lib/core/authorization/' \
            | grep -v 'lib/core/session/' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Role comparison outside the ability model:"
            echo "$matches"
            echo "Ask ability.can(action, resource) instead."
            exit 1
          fi

      - name: Arabic is the ARB template and carries every plural category
        # Arabic needs all six ICU categories authored per string from the
        # start (specs/08-design-system/style-guide.md). A counted string that
        # ships with only one/other has to be re-authored later, by which time
        # it is already translated.
        run: |
          python3 - <<'PY'
          import json, re, sys, pathlib

          arb_dir = pathlib.Path('mobile/lib/core/l10n/arb')
          ar = json.loads((arb_dir / 'app_ar.arb').read_text())

          required = {'zero', 'one', 'two', 'few', 'many', 'other'}
          failures = []

          for key, value in ar.items():
              if key.startswith('@') or not isinstance(value, str):
                  continue
              if ', plural,' not in value:
                  continue
              present = set(re.findall(r'(?<![a-z])(zero|one|two|few|many|other)\s*\{', value))
              missing = required - present
              if missing:
                  failures.append(f'{key}: missing {sorted(missing)}')

          # Every key in the template must exist in both translations.
          for locale in ('fr', 'en'):
              other = json.loads((arb_dir / f'app_{locale}.arb').read_text())
              untranslated = [
                  k for k in ar
                  if not k.startswith('@') and k not in other
              ]
              if untranslated:
                  failures.append(f'{locale}: missing {sorted(untranslated)}')

          if failures:
              print('::error::ARB problems:')
              for failure in failures:
                  print(f'  {failure}')
              sys.exit(1)
          print('ARB files OK')
          PY
