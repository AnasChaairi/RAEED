name: raeed
description: >-
  RAEED — the private platform connecting parents, educators (مؤطرين) and
  executives (مشرفين) around each enrolled child at RAEED Academy.
publish_to: none

# Not the marketing version — the build number is set by CI from the tag.
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State management + DI -------------------------------------------------
  # Riverpod doubles as the DI container (specs/06-mobile-app-spec.md), so no
  # separate service locator ships.
  flutter_riverpod: ^3.0.1
  riverpod_annotation: ^3.0.1

  # --- Navigation ------------------------------------------------------------
  # Typed deep links (a push opens the exact conversation/session) and
  # per-role redirect guards.
  go_router: ^17.0.0

  # --- Networking ------------------------------------------------------------
  dio: ^5.9.0

  # --- Local persistence -----------------------------------------------------
  # Drift backs the offline attendance/presence queue — the only two things
  # that work offline (specs/02-architecture.md).
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.42

  # --- Secure storage --------------------------------------------------------
  # Keychain/Keystore-backed access + refresh tokens.
  flutter_secure_storage: ^9.2.4

  # --- Push ------------------------------------------------------------------
  # Delivery only. No other Firebase product — keeps "no tracking SDK" intact.
  firebase_core: ^4.4.0
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.4.2

  # --- Error tracking --------------------------------------------------------
  sentry_flutter: ^9.7.0

  # --- i18n ------------------------------------------------------------------
  intl: ^0.20.2

  # --- Serialization ---------------------------------------------------------
  json_annotation: ^4.9.0

  # --- Platform / UI ---------------------------------------------------------
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.1.0
  package_info_plus: ^9.0.0
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.10.1
  custom_lint: ^0.8.1
  drift_dev: ^2.28.2
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1
  mocktail: ^1.0.4
  riverpod_generator: ^3.0.1
  riverpod_lint: ^3.0.1

  # Reads specs/04-api/openapi.yaml in the contract test that asserts the app's
  # DTOs never drift from the API contract.
  yaml: ^3.1.3

  # Test-only. `flutter test` runs on the Dart VM, so it needs a SQLite library
  # from the host rather than the one sqlite3_flutter_libs bundles into the app.
  # See test/support/sqlite_test_setup.dart.
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true

  # Generates lib/core/l10n/generated/** from the ARB files. Configured in
  # l10n.yaml.
  generate: true

  assets:
    - assets/images/

  # Bundled rather than fetched at runtime from Google Fonts: RAEED is used on
  # entry-level Android over weak connections (specs/11-testing-strategy.md),
  # and a login screen that renders in a fallback face while it waits on a font
  # CDN is not acceptable. Bundling also keeps the app free of a runtime call
  # to a third party, which matters for the CNDP posture in
  # specs/10-security-and-privacy.md.
  fonts:
    # Arabic — the primary reading language. Naskh text face, 400/700 only.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          weight: 400
          style: italic

    # Quranic/hadith excerpts inside Materials only — never UI chrome.
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
          weight: 400

    # Lora and Public Sans ship upstream as variable fonts with a `wght` axis.
    # One asset each, rather than four static cuts: smaller bundle, and every
    # weight on the axis is reachable. Flutter does not derive the axis from
    # `fontWeight` alone, so `RaeedTypography` sets `fontVariations` alongside
    # it — see lib/core/theme/raeed_typography.dart.

    # Latin display — French/English headings.
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf

    # UI chrome in both scripts — the fuller weight range Amiri lacks.
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf
