include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # RAEED handles children's records. A null slipping through a permission
    # scope or a consent check is a safeguarding failure, not a crash — so the
    # analyzer is configured to be loud rather than convenient.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Generated code is a build artefact; a stale one must fail the build.
    invalid_annotation_target: ignore
    # Promote these from warnings: each one has bitten a production Flutter app.
    missing_required_param: error
    missing_return: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
    # Every string the user can read has to come from the ARB files so the
    # Arabic/French/English builds stay in step.
    prefer_const_constructors: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    - "lib/core/l10n/generated/**"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # --- Correctness -------------------------------------------------------
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true
    unawaited_futures: true
    unnecessary_statements: true
    use_build_context_synchronously: true

    # --- Typing ------------------------------------------------------------
    avoid_type_to_string: true
    prefer_typing_uninitialized_variables: true
    strict_top_level_inference: true
    type_annotate_public_apis: true

    # --- Immutability / const ---------------------------------------------
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    prefer_final_locals: true

    # --- Style -------------------------------------------------------------
    avoid_redundant_argument_values: true
    directives_ordering: true
    omit_local_variable_types: false
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_constructors_first: true
    unnecessary_parenthesis: true
    use_named_constants: true
    use_super_parameters: true

    # --- Documentation -----------------------------------------------------
    # Public API in the domain and application layers is what other features
    # read; it carries doc comments, enforced in review rather than by lint.
    public_member_api_docs: false
    slash_for_doc_comments: true

    # --- Deliberately off --------------------------------------------------
    # A named parameter cannot be private, so a class with private fields and
    # a public named constructor (which most of core is) can never satisfy
    # this rule — the initializer list is the only legal form.
    prefer_initializing_formals: false
    # Arabic-first UI means many widgets legitimately nest deeply for RTL
    # mirroring; a line-length-driven rule fights that for no benefit.
    lines_longer_than_80_chars: false
    # `print` is already caught by avoid_print in flutter_lints.
